[package]
name = "herdr-agent-picker"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Native Herdr agent picker, completion hooks and reminders"

[[test]]
name = "fake_herdr"
path = "tests/support/fake_herdr.rs"
harness = false

[dependencies]
libc = "0.2.183"
regex = "1.12.3"
serde_json = "1.0.149"
sha2 = "0.10.9"
unicode-width = "0.2.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
